name: Build (Windows / macOS / Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile Main/Main.py
      - run: bash -n Build/scripts/build_unix.sh && bash -n Build/Build_Linux.sh && bash -n Build/Build_macOS.command

  build:
    name: Build ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The build scripts need NO Python: they download uv + a private Python themselves.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Build/scripts/build_windows.ps1 -NoPause

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash Build/scripts/build_unix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 4R022-Heart-${{ runner.os }}
          path: |
            Release/*.zip
            Release/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Release/*.zip
            Release/*.tar.gz
