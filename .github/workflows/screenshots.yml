name: Update screenshots

# Renders REAL screenshots with the app's own offscreen renderer and commits them to Assets/Screenshots.
# Run it manually: Actions -> "Update screenshots" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libdbus-1-3 libfontconfig1 \
            fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-thai-tlwg
      - run: pip install -r Build/requirements.txt
      - name: Render screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python Main/Main.py --screenshot Assets/Screenshots --size 1920x1080
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Screenshots
          git diff --cached --quiet || git commit -m "chore: update screenshots"
          git push
